<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123b35">
  <meta name="description" content="Controle de avarias e checklist de saída de veículos">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>FrotaCheck</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark"><img src="./icons/icon-192.png" alt=""></div><div><strong>FrotaCheck</strong><small>Controle de avarias</small></div></div>
  </header>
  <main class="shell">
    <section class="home">
      <div class="home-intro"><span class="eyebrow">FROTACHECK</span><h1>O que você quer fazer?</h1><p class="muted">Escolha uma opção para continuar.</p></div>
      <div class="home-grid">
        <a class="home-card" href="./Checklist/">
          <span class="home-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 9 1.6 1.6L14 7.5M9 15h6"/></svg></span>
          <strong>Checklist</strong>
          <small>Preencher o checklist de saída do veículo, registrar avarias e anexar fotos.</small>
          <span class="home-go">Abrir <span aria-hidden="true">→</span></span>
        </a>
        <a class="home-card" href="./Conferencia/">
          <span class="home-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>
          <strong>Conferência</strong>
          <small>Consultar todos os checklists enviados, ver as fotos e baixar o PDF.</small>
          <span class="home-go">Abrir <span aria-hidden="true">→</span></span>
        </a>
      </div>
    </section>
  </main>
  <script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});</script>
</body>
</html>
